name: Generate languages card

on:
  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Generate languages.svg
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=Tushar-07-byte&locale=en&hide_title=false&layout=compact&card_width=320&langs_count=6&bg_color=282a36&title_color=ff79c6&text_color=f8f8f2&border_color=44475a&hide_border=true&custom_title=Most%20Used%20Languages
          path: dist/languages.svg
          token: ${{ secrets.GH_STATS_TOKEN }}

      - name: Publish languages.svg
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: languages-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
